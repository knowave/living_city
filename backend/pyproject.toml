[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy>=2.1.8",
    "psycopg[binary]>=3.3.8",
    "simulation-engine",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: requires local PostgreSQL",
    "soak: long-running (8640+ ticks); skipped by default, run with `pytest -m soak`",
    "perf: report-only p95 latency measurement; skipped by default, run with `pytest -m perf -s`",
]
addopts = '-m "not soak and not perf"'  # a later `-m soak` on the command line overrides this

[tool.uv.sources]
simulation-engine = { path = "../simulation_engine", editable = true }
